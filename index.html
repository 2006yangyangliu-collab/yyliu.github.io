<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刘扬扬 - 个人简历</title>
    <!-- 引入基础样式和组件库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; overflow-x: hidden; }
        .tab-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 图标组件
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        const App = () => {
            const [photoColor, setPhotoColor] = useState('blue');
            const [activeTab, setActiveTab] = useState('about');

            // 定义图片路径（对应重命名后的英文名）
            const profileImages = {
                blue: 'blue.jpg',
                red: 'red.jpg',
                white: 'white.jpg'
            };
            const awardImg = 'award.jpg';

            const personalData = {
                name: "刘扬扬",
                birth: "2006年",
                phone: "15770380579",
                email: "yangyangliu@gmail.com",
                university: "长安大学",
                major: "车辆工程 (本科)",
                location: "西安",
                motto: "热衷于汽车工程与智能制造，致力于将科创思维融入工程实践，探索未来出行新可能。"
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    
                    {/* 侧边栏 */}
                    <aside className="w-full md:w-60 bg-slate-950 text-white flex flex-col shrink-0 z-30 shadow-2xl">
                        <div className="p-8">
                            <div className="w-8 h-1 bg-blue-500 mb-6 rounded-full"></div>
                            <h1 className="text-2xl font-black tracking-tight">{personalData.name}</h1>
                            <p className="text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">Personal Portfolio</p>
                        </div>
                        
                        <nav className="flex-1 px-4 py-2 space-y-2">
                            <button onClick={() => setActiveTab('about')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl tab-transition ${activeTab === 'about' ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/40' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                                <Icon name="user" /> <span className="text-sm font-medium">个人简介</span>
                            </button>
                            <button onClick={() => setActiveTab('highschool')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl tab-transition ${activeTab === 'highschool' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                                <Icon name="award" /> <span className="text-sm font-medium">高中荣誉</span>
                            </button>
                            <button onClick={() => setActiveTab('university')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl tab-transition ${activeTab === 'university' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                                <Icon name="book-open" /> <span className="text-sm font-medium">大学经历</span>
                            </button>
                        </nav>

                        <div className="p-6 bg-black/30 border-t border-white/5 text-center">
                             <p className="text-[10px] text-slate-500 font-bold tracking-widest">211 PROJECT · CHD</p>
                        </div>
                    </aside>

                    {/* 主展示区 */}
                    <main className="flex-1 overflow-y-auto">
                        <div className="max-w-4xl mx-auto p-6 md:p-12">
                            
                            {/* 顶部个人卡片 */}
                            <section className="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-8 mb-10 flex flex-col lg:flex-row items-center gap-10 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-[4rem] opacity-50 -z-0"></div>
                                
                                {/* 左侧：证件照 + 颜色切换 + 联系方式 */}
                                <div className="flex flex-col items-center shrink-0 z-10 space-y-6">
                                    <div className="flex flex-col items-center space-y-4">
                                        <div className="w-36 h-48 md:w-40 md:h-52 rounded-2xl shadow-2xl overflow-hidden border-[6px] border-white ring-1 ring-slate-200 bg-slate-50">
                                            <img 
                                                src={profileImages[photoColor]} 
                                                alt="刘扬扬" 
                                                className="w-full h-full object-cover"
                                                onError={(e) => { e.target.src='https://via.placeholder.com/200x260?text=Photo+Error' }}
                                            />
                                        </div>
                                        <div className="flex space-x-3 bg-slate-50 p-1.5 rounded-full border border-slate-200 shadow-inner">
                                            <button onClick={() => setPhotoColor('red')} className={`w-7 h-7 rounded-full bg-red-600 transition-transform ${photoColor === 'red' ? 'ring-2 ring-slate-900 ring-offset-2 scale-110' : 'opacity-60'}`}></button>
                                            <button onClick={() => setPhotoColor('white')} className={`w-7 h-7 rounded-full bg-white border border-slate-300 transition-transform ${photoColor === 'white' ? 'ring-2 ring-slate-900 ring-offset-2 scale-110 shadow-sm' : 'opacity-60'}`}></button>
                                            <button onClick={() => setPhotoColor('blue')} className={`w-7 h-7 rounded-full bg-blue-600 transition-transform ${photoColor === 'blue' ? 'ring-2 ring-slate-900 ring-offset-2 scale-110' : 'opacity-60'}`}></button>
                                        </div>
                                    </div>

                                    {/* 联系方式 - 置于照片下方 */}
                                    <div className="w-full space-y-2.5 bg-slate-50/80 p-4 rounded-2xl border border-slate-100 shadow-sm text-slate-700">
                                        <div className="flex items-center text-xs font-bold">
                                            <Icon name="phone" size={14} className="mr-2.5 text-blue-500"/>
                                            <span>{personalData.phone}</span>
                                        </div>
                                        <div className="flex items-center text-xs font-bold truncate">
                                            <Icon name="mail" size={14} className="mr-2.5 text-blue-500"/>
                                            <span>{personalData.email}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* 信息展示区 */}
                                <div className="flex-1 text-center lg:text-left z-10">
                                    <span className="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-[10px] font-black tracking-widest uppercase mb-4 inline-block tracking-tighter">Excellent Engineering Talent</span>
                                    <h2 className="text-4xl font-black text-slate-900 mb-4 tracking-tight">{personalData.name}</h2>
                                    <div className="grid grid-cols-2 gap-y-3 gap-x-6 text-sm text-slate-500 font-medium mb-8 text-left">
                                        <div className="flex items-center"><Icon name="calendar" size={14} className="mr-2 text-blue-500"/> {personalData.birth}</div>
                                        <div className="flex items-center"><Icon name="map-pin" size={14} className="mr-2 text-blue-500"/> {personalData.location}</div>
                                        <div className="flex items-center"><Icon name="graduation-cap" size={14} className="mr-2 text-blue-500"/> {personalData.university}</div>
                                        <div className="flex items-center"><Icon name="cpu" size={14} className="mr-2 text-blue-500"/> {personalData.major}</div>
                                    </div>
                                    <div className="bg-slate-50 p-5 rounded-2xl border-l-4 border-blue-600 text-slate-600 italic text-sm leading-relaxed">
                                        “{personalData.motto}”
                                    </div>
                                </div>
                            </section>

                            {/* 详情内容 */}
                            <div className="animate-in fade-in slide-in-from-bottom-4 duration-700">
                                {activeTab === 'about' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                            <h3 className="text-lg font-bold mb-6 flex items-center"><Icon name="zap" className="text-yellow-500 mr-2"/> 核心技能储备</h3>
                                            <div className="flex flex-wrap gap-2">
                                                {/* 驾照置顶并统一样式 */}
                                                {['C1 驾驶执照', 'AutoCAD', 'SolidWorks', 'MATLAB', 'Python', '车辆理论', '英语六级'].map(s => (
                                                    <span key={s} className="px-3 py-1.5 bg-slate-50 text-slate-600 rounded-xl text-xs font-bold border border-slate-100 flex items-center transition-colors hover:bg-blue-50 hover:text-blue-600">
                                                        {s === 'C1 驾驶执照' && <Icon name="car" size={12} className="mr-1.5" />}
                                                        {s}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="bg-slate-900 rounded-3xl p-8 text-white flex flex-col justify-between">
                                            <h3 className="text-blue-400 font-bold mb-4 flex items-center text-xs uppercase tracking-widest">Education Rank</h3>
                                            <div className="text-4xl font-black italic">TOP 15%</div>
                                            <p className="text-slate-500 text-[10px] mt-2 font-bold uppercase tracking-widest">综合排名百分比</p>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'highschool' && (
                                    <div className="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-slate-100">
                                        <h3 className="text-xl font-bold flex items-center mb-10"><Icon name="award" className="text-orange-500 mr-3"/> 高中荣誉展示</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                            <div className="group space-y-4">
                                                <div className="aspect-[3/4] bg-slate-100 rounded-2xl overflow-hidden border border-slate-200 shadow-md">
                                                    <img src={awardImg} alt="高中奖状" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" onError={(e) => { e.target.src='https://via.placeholder.com/300x400?text=Award+Image' }}/>
                                                </div>
                                                <h4 className="font-bold text-slate-900 text-center text-sm">全国中学生生物学联赛三等奖</h4>
                                            </div>
                                            <div className="space-y-4">
                                                <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                                    <h4 className="font-bold text-sm mb-2 text-blue-600 underline underline-offset-4">省级三好学生</h4>
                                                    <p className="text-xs text-slate-500 font-medium">展现全方位综合发展的优异素质。</p>
                                                </div>
                                                <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                                    <h4 className="font-bold text-sm mb-2 text-blue-600 underline underline-offset-4">校级优秀辩手</h4>
                                                    <p className="text-xs text-slate-500 font-medium">具备严谨的逻辑与出色的现场表达能力。</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'university' && (
                                    <div className="space-y-6">
                                        <div className="bg-slate-100/60 p-6 rounded-2xl border-l-4 border-emerald-500 relative overflow-hidden shadow-sm">
                                            <p className="text-sm text-slate-700 leading-relaxed font-medium">
                                                积极参与校内各类文体、志愿及社团活动，善于沟通协作，具备良好的团队配合与组织执行能力。
                                                在校主动参与多项校园活动与集体项目，性格开朗负责，抗压能力强，擅长统筹协调与人际沟通。
                                            </p>
                                        </div>

                                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                            <h3 className="text-xl font-bold flex items-center mb-8"><Icon name="star" className="text-emerald-500 mr-3"/> 大学经历与科创</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                                    <h4 className="font-black text-slate-900 mb-2">FSAE 赛车队</h4>
                                                    <p className="text-xs text-slate-600 font-medium italic">负责底盘轻量化优化与仿真计算。</p>
                                                </div>
                                                <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                                    <h4 className="font-black text-slate-900 mb-2">交通科技大赛 · 一等奖</h4>
                                                    <p className="text-xs text-slate-600 font-medium italic">主导智能控制原型搭建，负责全流程调试。</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between group">
                                            <div className="flex items-center space-x-5">
                                                <div className="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 font-black group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">科</div>
                                                <div>
                                                    <h4 className="font-bold text-sm text-slate-900">班级科技发展委员</h4>
                                                    <p className="text-[11px] text-slate-500 font-medium italic">组织多场技术沙龙，负责科创资源精准对接。</p>
                                                </div>
                                            </div>
                                            <Icon name="chevron-right" size={18} className="text-slate-300 group-hover:text-emerald-500 transition-all" />
                                        </div>
                                    </div>
                                )}
                            </div>

                            <footer className="mt-20 pb-10 text-center border-t border-slate-100 pt-8 text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                © 2026 LIU YANGYANG · PORTFOLIO
                            </footer>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
